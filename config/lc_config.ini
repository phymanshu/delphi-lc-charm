# lc_config.ini - settings for lc_run.py
#
#   python lc_run.py lc_config.ini reco      # heavy stage: needs the CSV dump (minutes to hours); only re-run it if you
#                                            # change something in [general] or [reco]
#   python lc_run.py lc_config.ini select    # instant: applies [select] and [fit] to the stored candidate table
#   python lc_run.py lc_config.ini select --set select.tag_p=3 --set select.label=_tight     # one-off override
#
# Empty value = default (the paper's value for the channel). Lines starting with # are comments.

[general]
# lc = Lambda_c -> p K pi (the target); dplus = D+ -> K pi pi (validation channel)
channel = lc
# the events files of the dump (the tracks files are found by name)
data_glob = /eos/user/h/hsharma/dump_lc_zpeak/csv/*.events.csv
# all_list.txt: maps dump file names to their data set (needed for exclude_sets)
setmap = all_list.txt
# prefix of everything that is written: <out>_candidates.csv.gz, <out>_select*.png, <out>_select*_summary.txt
out = lc_full


[reco]
# ---- needs a re-run of the reco stage when changed ----
# parallel processes; 0 = all files (set files = 40 for a quick test)
nproc = 8
files = 0
# data sets left out: the paper did not use 1992 for Lambda_c (little RICH information); 1991 is worse
exclude_sets = short91_f1,short92_e2
# loosest PID tag stored (1 loose, 2 standard, 3 tight). The select stage can only tighten it.
tag_min = 1
# the stored track errors are about 1.4 too small (lc_pull_check.py)
err_scale = 1.4
# |sqrt(s) - 91.19 GeV| window
ecm_window = 2.0
# loosest X_E and P(chi2) kept in the candidate table (empty = channel X_E min - 0.05); the select stage can only tighten
store_xe_min =
store_p_min = 1e-4


[select]
# ---- instant ----
# data subset: holdout = none | even | odd (event number parity: tune on one half, look at the other)
holdout = none
# charge of the first particle (proton for the Lambda_c): 0 = both, 1 = Lambda_c+, -1 = Lambda_c-
charge = 0
# PID: RICH tag (dE/dx tag if there is no RICH information) required for the proton and the kaon: 1 loose, 2 standard, 3 tight
tag_p = 1
tag_k = 1
# Cuts. EMPTY = the paper's value for the channel (Lambda_c: X_E > 0.30, L > 0.015 cm, P(chi2) > 0.001,
# helicity a,b,c = 0.5, 3.0, 0.15; D+: X_E > 0.20, L > 0.125 cm plus an energy-dependent cut, P > 0.001, a,b,c = 0.5, 3.0, 0.10).
# The scan on the data preferred l_min = 0.05 and p_min = 0.01 for the Lambda_c.
xe_min =
l_min =
p_min =
# helicity-angle cut X_E > a exp(+-b (cos -+ 1)) + c
helicity = yes
hel_a =
hel_b =
hel_c =
# split by the event b-tag (btp3 = positive-IP probability, small = lifetime-like; also bts3, btn3). Empty = off.
# b-rich: btag_hi = 0.05;  b-poor: btag_lo = 0.5
btag_var = btp3
btag_lo =
btag_hi =
# mass range of the spectrum (empty = channel default: 2.10-2.50 GeV for the Lambda_c)
mass_lo =
mass_hi =
# only for the D+ channel: veto M(K pi pi) - M(K pi) < 150 MeV
dstar_veto =
# suffix of the output file names, to keep several settings side by side
label =


[fit]
# ---- instant ----
# number of bins; empty = channel default (Lambda_c: 25 = 16 MeV, D+: 50 = 7 MeV)
bins =
fit = yes
# Gaussian width in MeV; 0 = free. The free width is not stable on this statistics: try 12, 16, 20
sigma_mev = 16
# the fit uses only mass +- this many GeV around the peak (broad structure elsewhere)
fit_half_range = 0.10
# counting: signal window half-width and sideband limits, as distances from the peak centre [GeV]
signal_window = 0.025
sideband_lo = 0.05
sideband_hi = 0.10
# centre = nominal mass + mass_shift [GeV]
mass_shift = 0.0
# plot the control sample scaled to the sidebands of the data
control_scaled = yes
# print the sideband-subtracted decay-length distribution of the peak
lhist = no
